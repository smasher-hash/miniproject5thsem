<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Detection History</title>
<style>
body{font-family:'Poppins',sans-serif;background:#f1f8e9;padding:30px;}
h2{color:#1b5e20;text-align:center;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #c8e6c9;padding:10px;text-align:center;}
th{background:#2e7d32;color:white;}
tr:nth-child(even){background:#f9fbe7;}
img{width:80px;border-radius:8px;}
</style>
</head>
<body>
<h2>📜 Detection History</h2>
<table>
<thead>
<tr><th>ID</th><th>Farmer</th><th>Image</th><th>Prediction</th><th>Confidence (%)</th><th>Date</th></tr>
</thead>
<tbody>
{% for row in history %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td><img src="{{ row[2] }}"></td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</body>
</html>
