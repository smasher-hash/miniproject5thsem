<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Alerts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #ffffff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .card h3 {
      font-size: 1.5em;
      color: #333;
    }

    .card p {
      color: #666;
    }

    .alert {
      margin-top: 15px;
      color: #c0392b;
      font-weight: bold;
    }

    :root{
  --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --accent:#60a5fa; --glass: rgba(255,255,255,0.03);
  --radius:14px; --maxw:880px;
}
*{
  box-sizing:border-box
}
html,body{
  height:100%
}
body{
  margin:0; font-family:Inter, system-ui, sans-serif;
  background: linear-gradient(180deg,#071024 0%, #071a2f 60%);
  color:#e6eef8; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  padding:28px;
}
.wrap{
  width:100%; 
  max-width:var(--maxw);
}
header{
  display:flex;
   align-items:center; 
   justify-content:space-between;
    gap:12px; 
    margin-bottom:18px
}
h1{
  font-size:20px; 
  margin:0
}
.controls{display:flex; 
  gap:8px; 
  align-items:center
}
input[type=text]{
  padding:10px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.06);
   background:var(--glass);
    color:inherit;
     min-width:220px
    }
button{
  background:linear-gradient(180deg,var(--accent),#3b82f6); 
  border:0; 
  color:white;
   padding:10px 14px;
    border-radius:12px;
     cursor:pointer
    }
button.secondary{
  background:transparent;
   border:1px solid rgba(255,255,255,0.06)
  }
main{
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); 
  padding:18px;
   border-radius:var(--radius); 
   box-shadow: 0 6px 30px rgba(3,7,18,0.6)
  }
.top{
  display:flex; 
  gap:16px; 
  align-items:center
}
.location{
  flex:1
}
.temp{
  font-size:46px;
   font-weight:600
  }
.desc{
  color:var(--muted);
   margin-top:6px
  }
.extra{
  display:flex; 
  gap:12px;
   margin-top:12px; 
   flex-wrap:wrap
  }
.chip{
  background:rgba(255,255,255,0.02); 
  padding:8px 10px;
   border-radius:10px; 
   min-width:100px; 
   text-align:center
  }
.forecast{
  display:grid;
   grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); 
   gap:10px;
    margin-top:16px
  }
.card{
  background:rgba(255,255,255,0.03); 
  padding:12px;
   border-radius:12px; 
   text-align:center}
.small{
  font-size:13px;
   color:var(--muted)
  }
footer{
  font-size:13px; 
  color:var(--muted); 
  margin-top:12px; 
  display:flex; 
  justify-content:space-between;
   align-items:center
  }
.hidden{
  display:none;
}
@media (max-width:520px){
   .temp{font-size:36px
  } 
  input[type=text]{
    min-width:120px
  } 
}
  </style>
</head>
<body>
    <div class="wrap">
    <header>
      <h1>Weather Forecast</h1>
      <div class="controls">
        <input id="q" type="text" placeholder="city name (e.g. New Delhi)" aria-label="City name" />
        <button id="searchBtn">Search</button>
        <button id="geoBtn" class="secondary">Use my location</button>
        <button id="unitsBtn" class="secondary">°C / °F</button>
      </div>
    </header>

    <main id="app">
      <div id="loading" class="card">Enter a city and press Search — or click "Use my location".</div>
      <section id="weatherPanel" class="hidden">
        <div class="top">
          <div class="location">
            <div style="display:flex; align-items:center; gap:10px">
              <div id="city" style="font-weight:700"></div>
              <div id="time" class="small" aria-live="polite"></div>
            </div>
            <div id="desc" class="desc"></div>
          </div>
          <div style="text-align:right">
            <div id="temp" class="temp"></div>
            <div id="icon" class="small"></div>
          </div>
        </div>

        <div class="extra">
          <div class="chip">Feels: <div id="feels" style="font-weight:600"></div></div>
          <div class="chip">Humidity: <div id="humidity" style="font-weight:600"></div></div>
          <div class="chip">Wind: <div id="wind" style="font-weight:600"></div></div>
        </div>

        <div class="forecast" id="forecast"></div>
      </section>

      <div id="error" class="card hidden" style="background:rgba(255,40,40,0.05); color:#ffdcdc"></div>

      <footer>
        <div class="attribution">Data from OpenWeatherMap </div>
        <div id="version" class="small"></div>
      </footer>
    </main>
  </div>


  <script>
    async function getWeather() {
      try {
        const response = await fetch('http://localhost:3000/api/weather?village=YourVillageName');
        const data = await response.json();

        document.getElementById('weather-description').textContent = data.description;

        if (data.alert) {   
          document.getElementById('weather-alert').textContent = `⚠️ Alert: ${data.alert}`;
        } else {
          document.getElementById('weather-alert').textContent = '';
        }
      } catch (error) {
        document.getElementById('weather-description').textContent = "Failed to load weather data.";
        console.error(error);
      }
    }

const API_KEY = '752fc0190efdd1f0ef72acf67beb5565'; // Add your OpenWeatherMap API key
const qEl = document.getElementById('q');
const searchBtn = document.getElementById('searchBtn');
const geoBtn = document.getElementById('geoBtn');
const unitsBtn = document.getElementById('unitsBtn');
const loading = document.getElementById('loading');
const weatherPanel = document.getElementById('weatherPanel');
const errorEl = document.getElementById('error');

const cityEl = document.getElementById('city');
const timeEl = document.getElementById('time');
const descEl = document.getElementById('desc');
const tempEl = document.getElementById('temp');
const iconEl = document.getElementById('icon');
const feelsEl = document.getElementById('feels');
const humidityEl = document.getElementById('humidity');
const windEl = document.getElementById('wind');
const forecastEl = document.getElementById('forecast');

let units = localStorage.getItem('units') || 'metric';
updateUnitsButton();

function showLoading(msg = 'Loading...'){
  loading.classList.remove('hidden'); loading.textContent = msg;
  weatherPanel.classList.add('hidden'); errorEl.classList.add('hidden');
}
function showError(msg){
  errorEl.classList.remove('hidden'); errorEl.textContent = msg;
  loading.classList.add('hidden'); weatherPanel.classList.add('hidden');
}
function showWeatherUI(){
  loading.classList.add('hidden'); errorEl.classList.add('hidden');
  weatherPanel.classList.remove('hidden');
}
function updateUnitsButton(){ unitsBtn.textContent = units === 'metric' ? '°C' : '°F'; }

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function getWeatherByCity(city){
  if(!API_KEY || API_KEY === ''){
    showError('No API key set — add it in script.js.'); 
    return;
  }
  showLoading(`Looking up ${city}...`);
  try{
    const cw = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=${units}&appid=${API_KEY}`);
    renderCurrent(cw);
    await getForecast(cw.coord.lat, cw.coord.lon);
    showWeatherUI();
  }catch(err){ showError('City not found or network error — ' + err.message); }
}

async function getWeatherByCoords(lat, lon){
  if(!API_KEY || API_KEY === '6306f4dade6d3778169a1e95bdf500c5'){
    showError('No API key set — add it in script.js.'); return;
  }
  showLoading('Detecting weather...');
  try{
    const cw = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${units}&appid=${API_KEY}`);
    renderCurrent(cw);
    await getForecast(lat, lon);
    showWeatherUI();
  }catch(err){ showError('Could not fetch weather — ' + err.message); }
}

async function getForecast(lat, lon){
  try{
    const f = await fetchJSON(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${units}&appid=${API_KEY}`);
    const next = {};
    f.list.forEach(item => {
      const d = new Date(item.dt * 1000);
      const day = d.toISOString().slice(0,10);
      const hour = d.getUTCHours();
      if(!next[day] || Math.abs(hour-12) < Math.abs(new Date(next[day].dt*1000).getUTCHours()-12)) next[day] = item;
    });
    const arr = Object.values(next).slice(1,6);
    renderForecast(arr);
  }catch(err){ forecastEl.innerHTML = '<div class="small">Forecast not available</div>'; }
}

function renderCurrent(data){
  cityEl.textContent = `${data.name}, ${data.sys?.country || ''}`.trim();
  const now = new Date(data.dt * 1000 + (data.timezone || 0) * 1000);
  timeEl.textContent = now.toLocaleString();
  descEl.textContent = capitalize(data.weather[0].description);
  tempEl.textContent = `${Math.round(data.main.temp)}°${units==='metric'?'C':'F'}`;
  feelsEl.textContent = `${Math.round(data.main.feels_like)}°`;
  humidityEl.textContent = data.main.humidity + '%';
  windEl.textContent = `${Math.round(data.wind.speed)} ${units==='metric'?'m/s':'mph'}`;
  iconEl.innerHTML = `<img alt="${data.weather[0].description}" style="width:54px;height:54px" src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png"/>`;
}

function renderForecast(arr){
  forecastEl.innerHTML = '';
  if(!arr || arr.length===0){ forecastEl.innerHTML = '<div class="small">No forecast available</div>'; return; }
  arr.forEach(item =>{
    const d = new Date(item.dt*1000);
    const dayName = d.toLocaleDateString(undefined,{weekday:'short'});
    const t = document.createElement('div'); t.className = 'card';
    t.innerHTML = `<div class="small">${dayName}</div>
                   <div style="font-weight:700;margin:6px">${Math.round(item.main.temp)}°</div>
                   <div class="small">${item.weather[0].description}</div>
                   <div style="margin-top:6px"><img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png"/></div>`;
    forecastEl.appendChild(t);
  });
}

function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

searchBtn.addEventListener('click', ()=>{ const v = qEl.value.trim(); if(v) { localStorage.setItem('lastCity', v); getWeatherByCity(v);} });
qEl.addEventListener('keyup', (e)=>{ if(e.key === 'Enter') searchBtn.click(); });
geoBtn.addEventListener('click', ()=>{
  if(!navigator.geolocation) return showError('Geolocation not supported');
  navigator.geolocation.getCurrentPosition(pos => {
    getWeatherByCoords(pos.coords.latitude, pos.coords.longitude);
  }, err => { showError('Location error: ' + err.message); });
});

unitsBtn.addEventListener('click', ()=>{
  units = units === 'metric' ? 'imperial' : 'metric';
  localStorage.setItem('units', units);
  updateUnitsButton();
  const lastCity = localStorage.getItem('lastCity');
  if(lastCity) getWeatherByCity(lastCity);
});

(function init(){
  const last = localStorage.getItem('lastCity');
  if(last){ qEl.value = last; getWeatherByCity(last); }
})();


    // Fetch on load
    window.onload = getWeather;
  </script>
  <script src="script.js"></script>
</body>
</html>
