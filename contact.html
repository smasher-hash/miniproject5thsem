<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Krisimitra_AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <section class="contact-section">
    <h2>📞 Contact Us</h2>
    <p>If you have any questions, feedback — reach out to us.  
    We’d love to help you grow better crops and get better yields 🌱</p>

    <form method="POST" action="/submit_contact" class="contact-form">
      <label>👨‍🌾 Full Name:</label><br>
      <input type="text" name="name" placeholder="Enter your name" required><br>

      <label>📧 Email:</label><br>
      <input type="email" name="email" placeholder="Enter your email" required><br>

      <label>📱 Phone:</label><br>
      <input type="text" name="phone" placeholder="Enter your phone number" required><br>

      <label>💬 Message:</label><br>
      <textarea name="message" rows="5" placeholder="Write your message here..." required></textarea><br>

      <button type="submit" class="btn"><a href="contact_success.html">Send Message</a></button>
    </form>

    <div class="contact-info">
      <h3>🌾 Krishi Office</h3> 
      <p><b>Address:</b> Krishi Bhavan, New Delhi, India</p>
      <p><b>Email:</b> support@smartkrishi.gov.in</p>
      <p><b>Helpline:</b> 1800-180-1551</p>
    </div>

    <div class="map-box">
      <iframe
        src="https://www.google.com/maps?q=Krishi+Bhavan,+New+Delhi,+India&output=embed"
        width="100%" height="300" style="border-radius:10px; border:0;" allowfullscreen>
      </iframe>
    </div>
  </section>
</body>
</html>
