<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandi Rates Comparison | Krisimitra_AI</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f5f9f6;
      background-image: url(rate.jpg);
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background-color: #2e7d32;
      color: white;
      text-align: center;
      padding: 1rem 0;
      font-size: 1.6rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      padding: 1.5rem 2rem;
    }

    h2 {
      color: #1b5e20;
      text-align: center;
      margin-bottom: 1rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1 1 48%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #43a047;
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f1f8f2;
      transition: background 0.3s ease;
    }

    .up {
      color: #2e7d32;
      font-weight: 600;
    }

    .down {
      color: #d32f2f;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      color: #555;
      font-size: 0.9rem;
      padding-bottom: 1rem;
    }

    @media (max-width: 768px) {
      input[type="text"] {
        flex: 1 1 100%;
      }
      th, td {
        font-size: 0.9rem;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <header>🌾 Krisimitra_AI — Mandi Rates Comparison</header>

  <div class="container">
 

    <div class="filters">
      <input type="text" id="cropInput" placeholder="🔍 Search by crop name..." oninput="filterMandi()">
      <input type="text" id="districtInput" placeholder="🏙️ Search by district or market..." oninput="filterMandi()">
    </div>

    
<table>
    <thead>
        <tr>
            <th>State</th>
            <th>District</th>
            <th>Market</th>
            <th>Commodity</th>
            <th>Variety</th>
            <th>Min Price (₹)</th>
            <th>Max Price (₹)</th>
            <th>Modal Price (₹)</th>
            <th>Arrival Date</th>
        </tr>
    </thead>
    <tbody id="mandiTableBody">
        <tr>
            <td colspan="9">Loading mandi prices...</td>
        </tr>
    </tbody>
</table>

  </div>

  <div class="footer">
    © 2025 Krisimitra_AI 
  </div>

  <script>
    // ===== Static Mandi Data with Previous & Current Day Prices =====
   
const tableBody = document.getElementById("mandiTableBody");

async function loadMandiData() {
    const crop = document.getElementById("cropInput").value.trim();
    const district = document.getElementById("districtInput").value.trim();

    tableBody.innerHTML =
        '<tr><td colspan="9">Loading live mandi prices...</td></tr>';

    try {
        const params = new URLSearchParams();

        if (crop) params.append("crop", crop);
        if (district) params.append("district", district);

        const response = await fetch(
    `http://127.0.0.1:5000/api/mandi?${params.toString()}`
);

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || "Unable to load mandi data");
        }

        displayMandiData(result.records);

    } catch (error) {
        console.error("Mandi Error:", error);

        tableBody.innerHTML =
            `<tr><td colspan="9">${error.message}</td></tr>`;
    }
}

function displayMandiData(data) {
    tableBody.innerHTML = "";

    if (!data || data.length === 0) {
        tableBody.innerHTML =
            '<tr><td colspan="9">No mandi records found.</td></tr>';
        return;
    }

    data.forEach(item => {
        const row = document.createElement("tr");

        const values = [
            item.state,
            item.district,
            item.market,
            item.commodity,
            item.variety,
            item.min_price,
            item.max_price,
            item.modal_price,
            item.arrival_date
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "N/A";
            row.appendChild(cell);
        });

        tableBody.appendChild(row);
    });
}

// Search automatically when filters change
let searchTimer;

function filterMandi() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadMandiData, 500);
}

// Load live data when page opens
loadMandiData();

  </script>
</body>
</html>
